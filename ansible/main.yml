---
- name: Deploy conduit app
  hosts: conduit-tf
  become: yes
  vars_files:
    - vars/main.yml
    - vars/vault.yml
    - vars/env_dev.yml

  tasks:
    # - name: Clean apt
    #   become: true
    #   apt:
    #     autoclean: yes
    #     autoremove: yes

    # - name: Fix broken packages
    #   become: true
    #   command: apt --fix-broken install

    - name: Update apt cache
      apt: update_cache=yes

    - name: Install base dependencies
      apt:
        name: 
          - git 
          - acl 
          - postgresql
          - nginx
        state: present
    
    - name: Install Node.js
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash - 
        sudo apt-get install -y nodejs

    - name: Clone or update github repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_version | default('main') }}"
        force: yes
        update: yes

    - name: Ensure correct ownership of conduit-app directory
      file:
        path: "{{ app_dir }}"
        owner: "{{ user }}"
        group: "{{ user }}"
        recurse: yes
      become: yes

    - name: Install project dependencies
      npm:
        path: "{{ app_dir }}"
      become: yes

    - name: Create .env file
      copy:
        content: |
          PORT= {{ be_port }}
          JWT_KEY={{ jwt_key }}
 
          ## Development Database
          DEV_DB_USERNAME={{ dev_db_username }}
          DEV_DB_PASSWORD={{ dev_db_password }}
          DEV_DB_NAME={{ dev_db_name }}
          DEV_DB_HOSTNAME={{ db_hostname }}
          DEV_DB_DIALECT={{ db_dialect }}
          DEV_DB_LOGGING=true
        dest: "{{ app_dir }}/backend/.env"
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: '0600'

    - name: Create database using Sequelize CLI
      become: yes
      become_user: postgres
      shell: |
        psql -c "CREATE DATABASE {{ dev_db_name }};"
        psql -c "CREATE USER {{ dev_db_username }} WITH ENCRYPTED PASSWORD '{{ dev_db_password }}';"
        psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ dev_db_name }} TO {{ dev_db_username }};"
        psql -d {{ dev_db_name }} -c "GRANT USAGE ON SCHEMA public TO {{ dev_db_username }};"
        psql -d {{ dev_db_name }} -c "GRANT CREATE ON SCHEMA public TO {{ dev_db_username }};"
        psql -d {{ dev_db_name }} -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ dev_db_username }};"
      args:
        executable: /bin/bash

    - name: Remove default Nginx configuration
      file:
        path: "{{ item }}"
        state: absent
      with_items:
        - /etc/nginx/conf.d/default.conf
        - /etc/nginx/sites-available/default
        - /etc/nginx/sites-enabled/default

    - name: Set up custom Nginx configuration
      template:
        src: nginx.conf.j2
        dest: "{{ item }}"
        mode: '0644'
        owner: root
        group: root
      loop:
        - "/etc/nginx/conf.d/conduit-app.conf"
        - "/etc/nginx/sites-enabled/conduit-app" 
      notify: Restart Nginx
    
    - name: Create log directory
      file:
        path: "{{ log_dir }}"
        state: directory
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: '0755'

    - name: Create log files
      file:
        path: "{{ item }}"
        state: touch
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: '0644'
      loop:
        - "{{ log_dir }}/error.log"
        - "{{ log_dir }}/out.log"

    - name: Set up systemd service
      template:
        src: conduit-app.service.j2
        dest: /etc/systemd/system/conduit-app.service
      notify: Restart application

  handlers:
    - name: Restart Nginx
      systemd:
        name: nginx
        state: restarted

    - name: Restart application
      systemd:
        name: conduit-app
        state: restarted
        daemon_reload: yes

    - name: Enable application service
      systemd:
        name: conduit-app
        enabled: yes
        state: started